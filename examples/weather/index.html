<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>dom-plan weather</title>
    <link rel="stylesheet" href="../shared/brutal.css" />
    <style>
      h1 {
        background: var(--blue);
        color: var(--paper);
      }
      #forecast {
        margin-top: 1.5rem;
        padding: 1rem 1.2rem;
        background: #fff;
        border: var(--border);
        box-shadow: var(--shadow);
      }
      #forecast:not(.has-data):not(.loading):not(.error) {
        display: none;
      }
      #forecast .status {
        display: none;
        margin: 0 0 0.8rem;
        padding: 0.4rem 0.7rem;
        border: var(--border);
      }
      #forecast.loading .status.loading {
        display: block;
        background: var(--yellow);
      }
      #forecast.loading .status.loading::after {
        content: '';
        animation: dots 900ms steps(4) infinite;
      }
      @keyframes dots {
        0% {
          content: '';
        }
        25% {
          content: '.';
        }
        50% {
          content: '..';
        }
        75% {
          content: '...';
        }
      }
      #forecast.error .status.error {
        display: block;
        background: var(--red);
      }
      #forecast.loading .days {
        opacity: 0.35;
      }
      #forecast:not(.has-data) .place,
      #forecast:not(.has-data) .days {
        display: none;
      }
      .place {
        margin: 0 0 0.6rem;
        font-size: 1.5rem;
        text-transform: uppercase;
      }
      .days {
        list-style: none;
        padding: 0;
        margin: 0;
        display: grid;
        gap: 0.5rem;
      }
      .days li {
        display: flex;
        justify-content: space-between;
        padding: 0.35rem 0.6rem;
        border: var(--border);
        background: var(--paper);
      }
      .days li:first-child {
        background: var(--yellow);
      }
    </style>
  </head>
  <body>
    <main id="app">
      <h1>weather</h1>
      <form><input name="city" placeholder="City" autocomplete="off" aria-label="City" /></form>
      <section id="forecast" aria-live="polite">
        <p class="status loading">Loading</p>
        <p class="status error">Could not load the forecast.</p>
        <h2 class="place"></h2>
        <ul class="days"></ul>
      </section>
    </main>
    <script src="bundle.js"></script>
  </body>
</html>
